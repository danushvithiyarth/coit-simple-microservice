version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/
    overwrite: true

permissions:
  - object: /home/ubuntu/coit-frontend
    pattern: "**"
    owner: root
    group: root
    mode: 755

hooks:
  AfterInstall:
    - location: coit-frontend/scripts/installationscript.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: coit-frontend/scripts/startserver.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: coit-frontend/scripts/validate_service.sh
      timeout: 300
      runas: root
