version: 0.2

phases:
  install:
    commands:
       - sudo apt-get update
       - sudo apt-get install npm -y
       - npm --version
  build:
    commands:
       - npm install 
      # - command
  post_build:
     commands:
        - echo "transfer the artifact..."
        - aws s3 cp build/* s3://codebuild-practice-danjim238/build/
      # - command
artifacts:
  files:
     - '**/*'
